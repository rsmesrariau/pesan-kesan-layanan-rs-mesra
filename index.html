<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pesan &amp; Kesan Layanan RS Mesra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6f4; --card:#ffffff; --ink:#14211c; --muted:#5b6b64; --line:#d5dfda;
  --accent:#0f6b4f; --accent-ink:#ffffff; --err:#b3261e; --focus:#0f6b4f33;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1714; --card:#17221d; --ink:#e8f0ec; --muted:#9db0a8; --line:#2b3a33;
    --accent:#2fb585; --accent-ink:#06150f; --err:#ff8a80; --focus:#2fb58540;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1714; --card:#17221d; --ink:#e8f0ec; --muted:#9db0a8; --line:#2b3a33;
  --accent:#2fb585; --accent-ink:#06150f; --err:#ff8a80; --focus:#2fb58540;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.7rem;font-weight:800;line-height:1.2;margin:8px 0 6px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 20px;font-size:.95rem}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.opt{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.row{display:grid;gap:16px}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr}}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:14px;cursor:pointer;font-size:1rem}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.err{color:var(--err);font-size:.85rem;font-weight:500;display:none}
.invalid input,.invalid select,.invalid textarea{border-color:var(--err)}
.invalid .err{display:block}
.note{color:var(--muted);font-size:.82rem;margin:14px 2px 0}
#fallback{display:none;margin-top:14px;font-size:.9rem}
#fallback a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Pesan &amp; Kesan Layanan RS Mesra</h1>
  <p class="lead">Isi formulir di bawah. Setelah menekan Kirim, pesan Anda akan terbuka di WhatsApp lengkap dengan isinya.</p>

  <form id="f" novalidate>
    <label id="g-nama">Nama
      <input id="nama" autocomplete="name" placeholder="Nama lengkap">
      <span class="err">Nama wajib diisi.</span>
    </label>
    <div class="row">
      <label id="g-hp">Nomor HP <span class="opt">(opsional)</span>
        <input id="hp" type="tel" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx">
      </label>
      <label id="g-jenis">Jenis layanan
        <select id="jenis">
          <option value="">Pilih jenis</option>
          <option>Rawat jalan</option>
          <option>Rawat inap</option>
          <option>IGD</option>
          <option>Farmasi / laboratorium / radiologi</option>
          <option>Pendaftaran / administrasi</option>
          <option>Lainnya</option>
        </select>
        <span class="err">Pilih jenis layanan.</span>
      </label>
    </div>
    <div class="row">
      <label id="g-lokasi">Lokasi
        <input id="lokasi" placeholder="Poli, ruangan, atau unit layanan">
        <span class="err">Lokasi wajib diisi.</span>
      </label>
      <label>Tanggal <span class="opt">(opsional)</span>
        <input id="tgl" type="date">
      </label>
    </div>
    <label id="g-detail">Pesan &amp; Kesan
      <textarea id="detail" placeholder="Tuliskan pesan dan kesan Anda terhadap layanan kami."></textarea>
      <span class="err">Pesan &amp; Kesan wajib diisi.</span>
    </label>
    <button type="submit">Kirim lewat WhatsApp</button>
    <div id="fallback">WhatsApp tidak terbuka? <a id="fb-link" href="#" target="_blank" rel="noopener">Ketuk di sini</a>.</div>
  </form>
  <p class="note">Data hanya dikirim ke WhatsApp penerima pesan. Anda tetap perlu menekan tombol kirim di WhatsApp.</p>
</main>

<script>
// Nomor WhatsApp tujuan: kode negara tanpa +, tanpa spasi (08xxx menjadi 628xxx)
var WA_NUMBER = "6282221973311";

var f = document.getElementById("f");
function val(id){ return document.getElementById(id).value.trim(); }

f.addEventListener("submit", function(e){
  e.preventDefault();
  var ok = true;
  [["nama","g-nama"],["jenis","g-jenis"],["lokasi","g-lokasi"],["detail","g-detail"]].forEach(function(p){
    var bad = !val(p[0]);
    document.getElementById(p[1]).classList.toggle("invalid", bad);
    if(bad) ok = false;
  });
  if(!ok) return;

  var tgl = val("tgl");
  if(tgl){
    var d = new Date(tgl + "T00:00:00");
    tgl = d.toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  }
  var now = new Date().toLocaleString("id-ID", {dateStyle:"long", timeStyle:"short"});

  var lines = [
    "*PESAN & KESAN LAYANAN RS MESRA*",
    "",
    "*Nama:* " + val("nama"),
    "*Nomor HP:* " + (val("hp") || "-"),
    "*Jenis layanan:* " + val("jenis"),
    "*Lokasi:* " + val("lokasi"),
    "*Tanggal:* " + (tgl || "-"),
    "",
    "*Pesan & Kesan:*",
    val("detail"),
    "",
    "_Dikirim pada " + now + "_"
  ];
  var url = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(lines.join("\n"));

  document.getElementById("fb-link").href = url;
  document.getElementById("fallback").style.display = "block";
  var w = window.open(url, "_blank");
  if(!w){ try{ window.top.location.href = url; }catch(err){} }
});
</script>
</body>
</html>
